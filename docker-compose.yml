services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    mem_limit: 1g                      # hard cap for the whole database container
    environment:
      POSTGRES_DB: electoral
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_pw
    secrets: [pg_superuser_pw]
    ports: ["127.0.0.1:5432:5432"]     # bind to localhost only; put a TLS proxy / private network in front
    volumes: ["pgdata:/var/lib/postgresql/data"]
    command: >
      postgres
      -c shared_buffers=256MB -c effective_cache_size=512MB
      -c work_mem=16MB -c maintenance_work_mem=128MB
      -c max_connections=60 -c max_wal_size=2GB
      -c password_encryption=scram-sha-256
      -c log_statement=ddl
  pgadmin:
    image: dpage/pgadmin4:9.8
    ports:
      - 5050:80
    environment:
      # Required by pgAdmin
      PGADMIN_DEFAULT_EMAIL: demo@example.com
      PGADMIN_DEFAULT_PASSWORD: secret

      # Don't require the user to login
      PGADMIN_CONFIG_SERVER_MODE: 'False'

      # Don't require a "master" password after logging in
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
secrets:
  pg_superuser_pw:
    file: ./secrets/pg_superuser_pw.txt
volumes:
  pgdata:
